        <h1>ISFP 유형 특징</h1>
        <p>ISFP 유형은 '호기심 많은 예술가'로 불리며, 따뜻하고 겸손한 마음으로 현재를 즐기며 살아갑니다. 이들은 예술적인 감각이 뛰어나고 융통성이 있으며, 다른 사람들에게 관대합니다.</p>
        <div class="mbti-content-placeholder">
            <!-- Detailed content will go here -->
            <p><strong>강점:</strong> 예술적 감각, 관용, 융통성, 따뜻함, 겸손함</p>
            <p><strong>약점:</strong> 장기 계획 수립 어려움, 비판에 민감, 과도한 자기 비판, 갈등 회피</p>
            <p><strong>추천 직업:</strong> 예술가, 디자이너, 음악가, 요리사, 플로리스트</p>
            <p><strong>궁합이 좋은 유형:</strong> ESFJ, ENFJ (이 부분은 실제 MBTI 이론에 따라 다를 수 있으며, 예시입니다)</p>
