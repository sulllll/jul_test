<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INFP 유형</title>
    <script src="../js/main_loader.js"></script>
    <link rel="stylesheet" href="../css/base.css">
</head>
<body>
    <div class="container result-screen" style="display: flex; opacity: 1; transform: translateY(0);">
        <h1>INFP 유형 특징</h1>
        <p>INFP 유형은 '열정적인 중재자'로 불리며, 깊은 가치관과 이상을 바탕으로 세상을 이해하고 돕고자 합니다. 이들은 창의적이고 공감 능력이 뛰어나며, 진실성을 중요하게 생각합니다.</p>
        <div class="mbti-content-placeholder">
            <!-- Detailed content will go here -->
            <p><strong>강점:</strong> 공감 능력, 창의력, 이상주의, 헌신적, 개방성</p>
            <p><strong>약점:</strong> 지나치게 이상적, 비현실적, 감정 기복, 자신을 돌보지 않음, 비판에 민감</p>
            <p><strong>추천 직업:</strong> 작가, 예술가, 상담사, 사회복지사, 교육자, 디자이너</p>
            <p><strong>궁합이 좋은 유형:</strong> ENFJ, ENTJ</p>
        </div>
        <div id="comment-section" class="comment-section-container">
            <h3 style="font: var(--font-h3); color: var(--text-primary); margin-bottom: var(--spacing-md);">댓글 남기기</h3>
            <textarea id="comment-input" style="width: 100%; min-height: 80px; padding: var(--spacing-sm); border: 1px solid var(--border-color); border-radius: var(--radius-md); margin-bottom: var(--spacing-sm); font: var(--font-body);" placeholder="여기에 댓글을 입력하세요..."></textarea>
            <button id="comment-submit-btn" class="btn btn-primary" style="margin-bottom: var(--spacing-lg);">댓글 등록</button>
            
            <h4 style="font: var(--font-h3); color: var(--text-primary); margin-bottom: var(--spacing-md); border-top: 1px solid var(--border-color); padding-top: var(--spacing-lg); margin-top: var(--spacing-lg);">댓글 목록</h4>
            <div id="comments-list" class="comments-list-area">
                <p class="placeholder-text" style="font: var(--font-body-small); color: var(--text-tertiary);">아직 댓글이 없습니다.</p>
            </div>
        </div>
        <a href="../index.html" class="btn-back">테스트로 돌아가기</a>
    </div>
    <script>
      // Optional: if any JS needed for these static pages in future
    </script>
    <script src="../js/localComments.js"></script>
</body>
</html>
