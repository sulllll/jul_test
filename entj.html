        <div class="mbti-content-placeholder">

            <p><strong>약점:</strong> 타인의 감정 간과, 조급함, 오만함, 지나친 통제욕</p>

            <p><strong>궁합이 좋은 유형:</strong> INTP, ISTP (이 부분은 실제 MBTI 이론에 따라 다를 수 있으며, 예시입니다)</p>
