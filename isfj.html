        <h1>ISFJ 유형 특징</h1>
        <p>ISFJ 유형은 '용감한 수호자'로 불리며, 헌신적이고 따뜻한 마음으로 주변 사람들을 돕는 데 큰 기쁨을 느낍니다. 이들은 책임감이 강하고 세심하며, 전통과 안정을 중시합니다.</p>
        <div class="mbti-content-placeholder">
            <!-- Detailed content will go here -->
            <p><strong>강점:</strong> 책임감, 헌신, 세심함, 공감 능력, 현실적인 지원</p>
            <p><strong>약점:</strong> 변화에 대한 어려움, 과도한 이타심, 자신을 돌보지 않음, 비판에 민감</p>
            <p><strong>추천 직업:</strong> 교사, 간호사, 사회복지사, 행정가, 상담사</p>
            <p><strong>궁합이 좋은 유형:</strong> ESFP, ESTP (이 부분은 실제 MBTI 이론에 따라 다를 수 있으며, 예시입니다)</p>
