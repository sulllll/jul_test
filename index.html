<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBTI 성격 유형 검사</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="welcome-screen">
        <h1>MBTI 성격 유형 검사에 오신 것을 환영합니다!</h1>
        <button id="start-btn">검사 시작</button>
    </div>

    <div id="question-screen" style="display: none;">
        <p id="question-text"></p>
        <div id="options-container">
            <!-- Answer buttons will be added here by JavaScript -->
        </div>
    </div>

    <div id="result-screen" style="display: none;">
        <p id="result-text"></p>
        <div id="community-link-container" style="margin-top: 20px;">
            <a id="community-link" href="#" target="_blank" style="display: none; text-decoration: none; padding: 10px 15px; background-color: #5cb85c; color: white; border-radius: 5px;">MBTI 커뮤니티 가기</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
