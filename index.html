<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBTI 성격 유형 검사</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="welcome-screen">
        <h1>MBTI 성격 유형 검사에 오신 것을 환영합니다!</h1>
        <button id="start-btn">검사 시작</button>
    </div>

    <div id="question-screen" style="display: none;">
        <p id="question-text"></p>
        <div id="options-container">
            <!-- Answer buttons will be added here by JavaScript -->
        </div>
    </div>

    <div id="result-screen" style="display: none;">
        <p id="result-text"></p>
        <div id="community-link-container"> <!-- Inline style removed -->
            <a id="community-link" href="#">MBTI 정보 보기</a> <!-- Inline style and target removed, text updated -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
