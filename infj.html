        <h1>INFJ 유형 특징</h1>
        <p>INFJ 유형은 '선의의 옹호자'로 불리며, 깊은 통찰력과 강한 직관력을 바탕으로 이상을 추구합니다. 이들은 조용하고 신중하지만, 자신의 신념에 대해서는 강한 열정을 보입니다.</p>
        <div class="mbti-content-placeholder">
            <!-- Detailed content will go here -->
            <p><strong>강점:</strong> 통찰력, 창의력, 공감 능력, 강한 신념, 타인에 대한 깊은 이해</p>
            <p><strong>약점:</strong> 완벽주의 성향, 높은 기대치, 번아웃 가능성, 지나친 이상주의</p>
            <p><strong>추천 직업:</strong> 상담가, 작가, 예술가, 학자, 심리학자, 사회복지사</p>
            <p><strong>궁합이 좋은 유형:</strong> ENFP, ENTP</p>
